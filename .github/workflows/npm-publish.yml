name: NPM Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  npm-publish:
    name: NPM Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --tag latest
